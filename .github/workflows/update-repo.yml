name: Update GNUSlashLinux Repository

on:
  push:
    paths:
      - 'x86_64/*.pkg.tar.zst'
  workflow_dispatch:

concurrency:
  group: repository-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # HINWEIS: Kein globaler Container mehr! Wir laufen nativ auf dem Ubuntu-Host.

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: GNUSlashLinux Datenbank aktualisieren (via Arch Docker)
      run: |
        # Wir starten das Arch-Image nur kurz isoliert, um die DB zu bauen
        docker run --rm -v ${{ github.workspace }}:/repo -w /repo archlinux:latest sh -c "
          pacman -Syu --noconfirm pacman-contrib
          cd x86_64
          repo-add GNUSlashLinux.db.tar.zst *.pkg.tar.zst
        "

    - name: Änderungen zurück in das Repo pushen
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # Auf dem Ubuntu-Host gibt es keinerlei "not a git repository" Fehler mehr
        git add x86_64/GNUSlashLinux.*
        if ! git diff-index --quiet HEAD; then
          git commit -m "Automatisches DB-Update (GNUSlashLinux)"
          git push origin main
        fi
