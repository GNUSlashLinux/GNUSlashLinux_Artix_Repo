name: Build Noctalia Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: artixlinux/base

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            gcc \
            meson \
            ninja \
            just \
            wayland \
            wayland-protocols \
            libglvnd \
            freetype2 \
            fontconfig \
            cairo \
            pango \
            harfbuzz \
            libxkbcommon \
            glib2 \
            libsecret \
            libsodium \
            sdbus-cpp \
            pipewire \
            wireplumber \
            polkit \
            pam \
            curl \
            libwebp \
            libjxl \
            libsndfile \
            librsvg \
            libqalculate \
            libxml2 \
            md4c \
            tomlplusplus \
            libical \
            nlohmann-json \
            stb \
            jemalloc

      - name: Create Builder User
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Package
        run: |
          su builder -c "
            cd $GITHUB_WORKSPACE/noctalia-git &&
            makepkg -fc --noconfirm
          "

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: noctalia-package
          path: noctalia-git/*.pkg.tar.zst
