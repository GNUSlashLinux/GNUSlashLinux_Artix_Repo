name: Build Noctalia Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            meson \
            ninja

      - name: Create Builder User
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Package
        run: |
          su builder -c "
            cd $GITHUB_WORKSPACE/noctalia-git &&
            makepkg -fc --noconfirm
          "

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: noctalia-package
          path: noctalia-git/*.pkg.tar.zst
