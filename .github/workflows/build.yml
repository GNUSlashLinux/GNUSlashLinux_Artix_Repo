name: Build Noctalia

on:
  workflow_dispatch:
  push:

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:

      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            meson \
            ninja

      - name: Build package
        run: |
          cd noctalia-git
          makepkg -sfc --noconfirm

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: noctalia-package
          path: noctalia-git/*.pkg.tar.zst
